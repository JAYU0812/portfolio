<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E" />
      <stop offset="50%" stop-color="#121316" />
      <stop offset="100%" stop-color="#161922" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C27803" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#E8C37D" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#252834" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Glow -->
  <circle cx="1050" cy="150" r="280" fill="#C27803" opacity="0.12" filter="blur(80px)" />
  <circle cx="150" cy="500" r="240" fill="#1C202B" opacity="0.3" filter="blur(80px)" />

  <!-- Border Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#2B303E" stroke-width="2" />

  <!-- Monogram Logo Badge -->
  <rect x="90" y="90" width="64" height="64" rx="16" fill="#1C202B" stroke="#3A4050" stroke-width="1.5" />
  <text x="122" y="132" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" fill="#E8C37D" text-anchor="middle">SJ</text>

  <!-- Status Chip -->
  <rect x="174" y="102" width="410" height="40" rx="20" fill="#14161E" stroke="#262933" stroke-width="1" />
  <circle cx="196" cy="122" r="5" fill="#10B981" />
  <text x="214" y="127" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E8C37D" font-weight="600">Lead Architect @ NB Developers · Ahmedabad</text>

  <!-- Award Badge -->
  <rect x="600" y="102" width="280" height="40" rx="20" fill="#2E2008" stroke="#C27803" stroke-width="1" />
  <text x="740" y="127" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FCD34D" font-weight="700" text-anchor="middle">🏆 R&amp;R Award Winner 2026</text>

  <!-- Main Headline -->
  <text x="90" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Soni Jaykumar Hasmukh
  </text>
  <text x="90" y="285" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="url(#gold)">
    Lead Mobile &amp; Full-Stack Architect
  </text>

  <!-- Bio & Location Subtitle -->
  <text x="90" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" fill="#A1A7B5" width="900">
    Architecting enterprise PropTech, Offline-First Isar DB (2–8ms), Flutter &amp; NestJS systems in Ahmedabad.
  </text>
  <text x="90" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="19" fill="#A1A7B5">
    Creator of PropKart OS, GitSphere Desktop &amp; published Google Play Store applications.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(90, 420)">
    <!-- Flutter -->
    <rect x="0" y="0" width="110" height="38" rx="10" fill="#1C202B" stroke="#2E3342" />
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E5E7EB" text-anchor="middle">Flutter</text>
    <!-- React & Next.js -->
    <rect x="122" y="0" width="165" height="38" rx="10" fill="#1C202B" stroke="#2E3342" />
    <text x="204" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E5E7EB" text-anchor="middle">React / Next.js</text>
    <!-- Node.js / NestJS -->
    <rect x="299" y="0" width="175" height="38" rx="10" fill="#1C202B" stroke="#2E3342" />
    <text x="386" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E5E7EB" text-anchor="middle">Node.js / NestJS</text>
    <!-- PostgreSQL -->
    <rect x="486" y="0" width="145" height="38" rx="10" fill="#1C202B" stroke="#2E3342" />
    <text x="558" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#E5E7EB" text-anchor="middle">PostgreSQL</text>
    <!-- Offline-First -->
    <rect x="643" y="0" width="190" height="38" rx="10" fill="#1C202B" stroke="#2E3342" />
    <text x="738" y="24" font-family="'JetBrains Mono', monospace" font-size="14" fill="#10B981" font-weight="600" text-anchor="middle">Offline-First (Isar)</text>
  </g>

  <!-- Footer Info Line -->
  <line x1="90" y1="500" x2="1110" y2="500" stroke="#222530" stroke-width="1.5" />
  
  <text x="90" y="540" font-family="'JetBrains Mono', monospace" font-size="15" fill="#7A7E89">
    📍 Ahmedabad, Gujarat, India  •  portfolio-iota-nine-7b2v5ah7u8.vercel.app
  </text>
  <text x="1110" y="540" font-family="'JetBrains Mono', monospace" font-size="15" fill="#E8C37D" text-anchor="end" font-weight="bold">
    Available for High-Impact Projects ↗
  </text>
</svg>
